<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColor" content="#141413">
<script>try{var t=JSON.parse(localStorage.getItem("fd-theme")||'"auto"');if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Load ticket fan deck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Fan deck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#faf9f5;
  --ink:#1a1a18; --ink-2:#55544f; --ink-3:#8a8882;
  --line:rgba(20,20,18,.12); --line-2:rgba(20,20,18,.26);
  --accent:#185FA5; --accent-bg:#E6F1FB; --accent-line:#85B7EB;
  --shadow:0 1px 3px rgba(0,0,0,.10);
  --glass-track:rgba(255,255,255,.45);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));
  --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.3));
  --glass-edge:rgba(255,255,255,.95);
  --glass-shadow:0 4px 14px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.05);
}
/* Theme: follows the device unless the settings menu pins it (data-theme on <html>) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1f1f1d; --surface-2:#262624;
    --ink:#f0efea; --ink-2:#c3c2b7; --ink-3:#8a8882;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.28);
    --accent:#85B7EB; --accent-bg:#0C2E4F; --accent-line:#185FA5;
    --shadow:0 1px 3px rgba(0,0,0,.5);
    --glass-track:rgba(255,255,255,.06);
    --glass-fill:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));
    --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
    --glass-edge:rgba(255,255,255,.30);
    --glass-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.40),inset 0 -3px 6px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1f1f1d; --surface-2:#262624;
  --ink:#f0efea; --ink-2:#c3c2b7; --ink-3:#8a8882;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.28);
  --accent:#85B7EB; --accent-bg:#0C2E4F; --accent-line:#185FA5;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --glass-track:rgba(255,255,255,.06);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));
  --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
  --glass-edge:rgba(255,255,255,.30);
  --glass-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.40),inset 0 -3px 6px rgba(0,0,0,.25);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(60vw 42vh at 8% 0%,rgba(214,48,49,.15),transparent 70%),radial-gradient(50vw 40vh at 96% 6%,rgba(86,168,64,.14),transparent 70%),radial-gradient(70vw 50vh at 50% 100%,rgba(186,117,23,.09),transparent 70%),var(--bg);min-height:100vh;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
/* installed as an app the page runs under the status bar, so keep clear of the notch / Dynamic Island */
.page{max-width:2000px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .days{margin-left:auto}
.menu-w{position:relative;flex:none}
.menu{position:absolute;right:0;top:54px;z-index:60;min-width:190px;padding:6px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);box-shadow:0 14px 34px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px;transform-origin:100% 0;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .18s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:11px;background:transparent;font-size:14px;text-align:left;cursor:pointer}
.mi[hidden]{display:none}
.mi:hover{background:var(--surface-2)}
.msep{height:1px;margin:4px 8px;background:var(--line)}
.mform{display:flex;gap:6px;padding:4px 8px 8px}
.mform[hidden]{display:none}
.mhelp{margin:0 8px 8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;line-height:1.45;color:var(--ink-2)}
.mhelp[hidden]{display:none}
.mhelp b{color:var(--ink);font-weight:600}
.mhelp svg{vertical-align:-4px;margin:0 2px}
.mform input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px}
.mform .btn{min-height:40px}
.menu{min-width:250px}
.mi.live::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.top-l{display:flex;align-items:center;gap:10px}
.reset{width:46px;height:46px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:var(--ink-3);border:1px solid var(--line);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);transition:transform .3s cubic-bezier(.3,1.7,.5,1),color .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.reset.live{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.reset:active{transform:scale(.88)}
.reset.busy svg{animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.reset.go svg{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
/* glass controls: a translucent track with a draggable lens */
.seg,.days{position:relative;display:inline-flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.seg button,.dayc{position:relative;z-index:2;border:0;background:transparent;cursor:pointer;color:var(--ink-2);transition:color .25s;-webkit-tap-highlight-color:transparent}
.seg button{min-height:40px;padding:6px 16px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.dayc{width:clamp(42px,12.2vw,54px);height:46px;padding:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dayc .w{font-size:10px}
.dayc .d{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.dayc.in{color:var(--ink)}
.dayc.in .d{font-weight:700}
.dayc.none .d{color:var(--ink-3);font-weight:400}
.glass{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;z-index:1;pointer-events:none;background:var(--glass-fill);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);transform:scale(1);transition:left .55s cubic-bezier(.3,1.45,.5,1),width .55s cubic-bezier(.3,1.45,.5,1),transform .4s cubic-bezier(.3,1.7,.5,1),opacity .25s}
.glass.drag{transition:transform .18s ease-out,opacity .25s,width .2s;transform:scale(calc(1.06 * var(--sx,1)),calc(1.24 / var(--sx,1)));background:var(--glass-fill-drag)}
/* upright iPad: Home, Refresh, period, days and the menu share one row */
@media (min-width:701px) and (max-width:899px){.dayc{width:clamp(40px,5.6vw,46px)}.top{gap:8px}.top-l{gap:8px}.reset{width:40px;height:40px}.seg button{padding:6px 12px}}
@media (max-width:700px){.top{justify-content:center}.top .days{margin-left:0;order:3}.menu-w{order:2}.wide-only{display:none}}

.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* layout: filters left, fan right on tablets and up */
.layout{margin-top:14px;transition:opacity .5s ease}
.top{transition:opacity .5s ease}
.page.reflow .layout,.page.reflow .top{opacity:0;transition:none}
.btn.live{color:var(--bg);background:var(--ink);border-color:var(--ink)}
/* wide screens (desktop, iPad on its side): filters in a column on the left. An upright iPad keeps them in a row
   so the deck gets the full width. */
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:clamp(204px,16vw,280px) minmax(0,1fr);gap:16px;align-items:start}
  .side{position:sticky;top:12px}
}

/* orbs */
.orbs{position:relative;height:112px;transition:height .45s cubic-bezier(.2,.8,.2,1);margin-top:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.orb-cap{position:absolute;top:0;transition:top .45s cubic-bezier(.2,.8,.2,1);font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;transform:translateX(-50%);white-space:nowrap}
.orb{position:absolute;left:0;top:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;line-height:1.15;cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transition:transform .5s cubic-bezier(.25,.9,.3,1.15),opacity .3s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.orb:hover{border-color:var(--ink-2)}}
.orb .o1{font-size:calc(11px * var(--k,1));color:var(--ink-2)}
.orb .o2{font-size:calc(13px * var(--k,1));font-weight:600;color:var(--ink)}
.orb.on{background:var(--accent-bg);border-color:var(--accent-line)}
.orb.on .o1,.orb.on .o2{color:var(--accent)}
.orb.open{border:2px solid var(--ink)}
.orb.lead{background:var(--ink);border-color:var(--ink)}
.orb.lead .o1{color:var(--bg);opacity:.75}
.orb.lead .o2{color:var(--bg)}
.orb.zero{background:transparent;box-shadow:none;cursor:default}
.orb.zero .o1,.orb.zero .o2{color:var(--ink-3)}
.o-x{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:none;align-items:center;justify-content:center;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.o-x::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.o-x.del{display:flex;width:24px;height:24px;top:-5px;right:-5px;font-size:14px}
.orb.on .o-x{display:flex;animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.o-x:active{transform:scale(.85)}

/* toolbar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;min-height:36px}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.crumbs .hint{font-size:13px;color:var(--ink-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;min-height:38px;padding:5px 14px;font-size:13px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.btn:active{transform:scale(.94)}
.btn:hover{border-color:var(--ink-2)}
.grow{flex:1}
.bar label{font-size:13px;color:var(--ink-2)}
.bar select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;min-height:38px;padding:5px 8px;font-size:13px}

/* lens: full-size readout of the blade under the pointer or finger */
.lens{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden}
.lens.idle{color:var(--ink-3);font-size:13px}
.lens .l-n{font-weight:600;flex:none}
.lens .l-m{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lens .pill{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.lens .pill small{font-weight:400;font-size:11px;margin-right:4px;opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}

/* stage + cards: a shallow arc around a pivot far below the screen, so every card stays nearly upright */
.stage{position:relative;overflow:hidden;overflow:clip;height:320px;transition:height .7s cubic-bezier(.3,.8,.2,1);margin-top:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage-in{position:absolute;left:50%;top:0;width:var(--dw,860px);height:520px;margin-left:calc(var(--dw,860px) / -2);transform-origin:50% 0;transform:scale(var(--s,1));transition:transform .6s cubic-bezier(.3,.8,.2,1)}
.deck{position:absolute;left:50%;top:0;width:0;height:0;--R:1300px;transition:transform .7s cubic-bezier(.3,.8,.2,1)}
#deckC{z-index:5}
/* a crowded deck keeps its cards readable and runs off the sides instead; drag to spin it */
.deck.spin .blade{transition:opacity .4s,border-color .2s,box-shadow .2s}
.stage.ovf{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);cursor:grab}
.blade{position:absolute;bottom:0;width:120px;height:224px;left:-60px;display:flex;flex-direction:column;gap:4px;padding:8px 8px 7px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;cursor:pointer;user-select:none;box-shadow:var(--shadow);transform-origin:50% 100%;--a:0deg;--lift:0px;--sc:1;transform:translateY(var(--R)) rotate(var(--a)) translateY(calc(var(--lift) - var(--R))) scale(var(--sc));transition:transform .5s cubic-bezier(.25,.9,.3,1.1),opacity .4s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.blade.load{width:114px;left:-57px}
.blade.enter{opacity:0}
.blade.hot{--lift:-16px;--sc:1.14;z-index:500!important;border-color:var(--ink-2);box-shadow:0 12px 30px rgba(0,0,0,.28)}
.blade.sel,.blade.sel.hot{--lift:-24px;--sc:1.1;border-color:var(--ink);border-width:1.5px}
.blade.up{--lift:-12px;border-color:var(--ink);border-width:2px}
.blade.dim{opacity:.55}
.blade.dim.hot{opacity:1}
.c-name{font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-sub{font-size:12px;color:var(--ink-2);line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.c-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.c-id{font-size:18px;font-weight:700;line-height:20px;font-variant-numeric:tabular-nums}
/* values sit on the left of each chip: when cards overlap, the left edge is the part that stays visible */
.chips{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.chip{border-radius:9px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:6px;padding:4px 7px 5px;line-height:1;font-variant-numeric:tabular-nums}
.chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.chip small{grid-column:1 / -1;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.chip b{font-size:25px;font-weight:700;letter-spacing:-.02em}
.load .chip b{font-size:24px}
.sp{display:block;width:100%;height:18px;overflow:visible}
.wh{position:relative;display:block;height:5px;width:100%;border-radius:3px;background:color-mix(in srgb,currentColor 22%,transparent)}
.wh i{position:absolute;top:0;bottom:0;border-radius:3px;background:currentColor;opacity:.85}
/* one-measure mode: a single large value, the other two as small pills */
/* cards never overlap in this mode, so the big value can sit dead centre */
.chip.big{padding:6px 8px 7px;justify-items:center;text-align:center}
.chip.big small{justify-self:center}
.chip.big b{font-size:44px;grid-column:1 / -1;justify-self:center}
.chip.big .sp{grid-column:1 / -1;height:22px;margin-top:5px}
.chip.big .wh{grid-column:1 / -1;margin-top:7px}
.mrow{display:flex;gap:4px}
.mchip{flex:1 1 0;min-width:0;overflow:hidden;border-radius:7px;font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:20px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.mchip small{font-size:9.5px;font-weight:600;letter-spacing:.02em;opacity:.8;margin-right:2px;text-transform:uppercase}
.seg.small button{min-height:34px;padding:4px 13px}

/* ticket detail: rises out of the top of the selected load's card */
.stage-wrap{position:relative;transition:margin-top .6s cubic-bezier(.3,.8,.2,1)}
/* Drawn outside the scaled deck and revealed with a clip instead of a scale: text that is scaled up
   from a small bitmap stays blurry on iPad Safari. */
.pop{position:absolute;left:0;top:0;z-index:40;box-sizing:border-box;padding:12px 14px 10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;font-size:13.5px;color:var(--ink-2);opacity:0;pointer-events:none;transform:translateY(18px);-webkit-clip-path:circle(0 at var(--ox,50%) 100%);clip-path:circle(0 at var(--ox,50%) 100%);transition:clip-path .5s cubic-bezier(.3,.9,.3,1),-webkit-clip-path .5s cubic-bezier(.3,.9,.3,1),transform .5s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.pop.on{opacity:1;pointer-events:auto;transform:none;-webkit-clip-path:circle(160% at var(--ox,50%) 100%);clip-path:circle(160% at var(--ox,50%) 100%)}
.pop.done{-webkit-clip-path:none;clip-path:none;box-shadow:0 14px 34px rgba(0,0,0,.30)}
.pop-stem{position:absolute;top:100%;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:0 0 2px 2px}
.pop-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:30px}
.pop-t{font-size:1.3em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pop-m{line-height:1.35}
.pop-r{display:grid;grid-template-columns:6.4em minmax(0,1fr) 3em;align-items:center;gap:10px;margin-top:6px}
.pop-r small{display:block;font-size:.85em;color:var(--ink-3)}
.pop-v{text-align:right;font-size:1.25em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pop-n{margin:8px 0 0;font-size:.85em;color:var(--ink-3)}
.pop-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;cursor:pointer;padding:0;color:var(--ink-2)}
/* go back down a level */
.down{position:absolute;left:50%;bottom:6px;z-index:30;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink);border:1px solid var(--line-2);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:var(--shadow);transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.5,.5,1),opacity .25s;-webkit-tap-highlight-color:transparent}
.down.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.down:active{transform:translate(-50%,0) scale(.94)}
.down svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){.down svg{animation:none}}

/* table */
.reset.tbl{width:40px;height:40px}
.tw{overflow-x:auto;margin-top:12px;font-size:13px;animation:rise .35s cubic-bezier(.3,1.3,.5,1);background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:12px}

}

<body>
<div class="page">
  <h1 class="sr-only">Load ticket fan deck</h1>
  <div class="top">
    <div class="top-l">
      <button class="reset" id="resetBtn" aria-label="Home: back to the default view" title="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5.5h4v5.5"/></svg>
      </button>
      <button class="reset" id="refreshBtn" aria-label="Refresh data" title="Refresh">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <div class="seg" id="period" role="group" aria-label="Period">
        <button data-p="1">Today</button>
        <button data-p="3"><span class="wide-only">Last </span>3 days</button>
        <button data-p="7"><span class="wide-only">Last </span>7 days</button>
      </div>
    </div>
    <div class="days" id="days" role="group" aria-label="Pick a single day"></div>
    <div class="menu-w" id="menuW">
      <button class="reset" id="menuBtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="menu" id="menu" role="menu">
        <button class="mi" id="saveBtn" role="menuitem">Save this view</button>
        <div class="mform" id="saveForm" hidden>
          <input id="saveName" maxlength="22" placeholder="Name this view" aria-label="View name" autocomplete="off">
          <button class="btn" id="saveGo">Save</button>
        </div>
        <button class="mi" id="homeSet" role="menuitem">Make this view Home</button>
        <button class="mi" id="homeClr" role="menuitem" hidden>Use the built-in Home</button>
        <div class="msep"></div>
        <button class="mi" id="installBtn" role="menuitem">Install on Home Screen</button>
        <div class="mhelp" id="installHelp" hidden></div>
        <button class="mi" id="themeBtn" role="menuitem">Theme: Auto</button>
        <button class="mi" id="sndBtn" role="menuitemcheckbox" aria-checked="false">Sound off</button>
      </div>
    </div>
  </div>

  <div class="layout">
  <aside class="side">
    <div class="orbs" id="orbs"></div>
  </aside>

  <main class="main">
  <div class="bar">
    <div class="crumbs" id="crumbs"></div>
    <span class="grow"></span>
    <div class="seg small" id="show" role="group" aria-label="Show on cards">
      <button data-k="all">All</button>
      <button data-k="p" title="Pressure (lb)">P</button>
      <button data-k="st" title="Starch (1–6)">St</button>
      <button data-k="ss" title="Soluble solids (°Bx)">SS</button>
    </div>
    <button class="reset tbl" id="tblBtn" aria-label="Show loads as a table" aria-pressed="false" title="Table of loads">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>
    </button>
  </div>

  <div class="lens idle" id="lens" aria-live="off"></div>

  <div class="stage-wrap">
  <div class="pop" id="pop" role="dialog" aria-label="Ticket detail"></div>
  <div class="stage" id="stage">
    <h2 class="sr-only">Fan deck. Each blade is a group average; opening a blade fans out one blade per load.</h2>
    <div class="stage-in" id="stageIn">
      <div class="deck" id="deckP"></div>
      <div class="deck" id="deckC"></div>
    </div>
    <button class="down" id="downBtn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <span id="downLbl"></span>
    </button>
  </div>
  </div>

  <div class="tw" id="tableWrap" hidden><table id="table"></table></div>
  </main>
  </div>


</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ metrics */
const METRICS = {
  p:  {name:'Pressure', tag:'P', unit:'lb', dom:[11,22], cdom:[13.5,19.5], band:[15,18], dot:'#378ADD',
       light:{f:['#E6F1FB','#B5D4F4','#85B7EB','#378ADD','#185FA5'], i:['#042C53','#042C53','#042C53','#042C53','#E6F1FB']},
       dark: {f:['#042C53','#0C447C','#185FA5','#378ADD','#85B7EB'], i:['#B5D4F4','#E6F1FB','#E6F1FB','#042C53','#042C53']}},
  st: {name:'Starch', tag:'St', unit:'1–6', dom:[1,6], cdom:[1.5,5.5], band:[2,4], dot:'#D4537E',
       light:{f:['#FBEAF0','#F4C0D1','#ED93B1','#D4537E','#993556'], i:['#4B1528','#4B1528','#4B1528','#4B1528','#FBEAF0']},
       dark: {f:['#4B1528','#72243E','#993556','#D4537E','#ED93B1'], i:['#F4C0D1','#FBEAF0','#FBEAF0','#4B1528','#4B1528']}},
  ss: {name:'Soluble solids', tag:'SS', unit:'°Bx', dom:[9,17], cdom:[11.5,15], band:[12,14.5], dot:'#BA7517',
       light:{f:['#FAEEDA','#FAC775','#EF9F27','#BA7517','#854F0B'], i:['#412402','#412402','#412402','#412402','#FAEEDA']},
       dark: {f:['#412402','#633806','#854F0B','#BA7517','#EF9F27'], i:['#FAC775','#FAEEDA','#FAEEDA','#412402','#412402']}}
};
const KEYS = ['p','st','ss'];
const DIMS = {
  grower:{label:'Grower', plural:'growers'},
  lot:{label:'Lot', plural:'lots'},
  variety:{label:'Variety', plural:'varieties'},
  source:{label:'Source', plural:'sources'},
  day:{label:'Day', plural:'days'}
};
const VCODE = {'Honeycrisp':'HC','Gala':'GA','Fuji':'FJ','Granny Smith':'GS','Cosmic Crisp':'CC'};
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let theme = 'auto';   /* auto | light | dark */
const isDark = () => theme === 'dark' || (theme === 'auto' && darkMQ.matches);
const calmMQ = matchMedia('(prefers-reduced-motion: reduce)');

/* --------------------------------------------------------------------- data */
/* Ticket shape: {id, daysAgo, ts (minutes, for ordering), time, day, dayShort, grower, source, variety, block, bins,
   lot, samples:{p:[],st:[],ss:[]}}. Averages are derived below. */
function buildMockTickets(){
  let seed = 41;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const g = () => (rnd()+rnd()+rnd()-1.5)*1.15;
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(rnd()*a.length)];
  const growers = [
    {n:'Home Ranch', s:'Captive', b:-.12, v:['Honeycrisp','Gala','Cosmic Crisp']},
    {n:'River Bench', s:'Captive', b:.05, v:['Fuji','Granny Smith','Gala']},
    {n:'Alder Creek', s:'Outside', b:.18, v:['Honeycrisp','Fuji']},
    {n:'Kessler Fruit', s:'Outside', b:-.02, v:['Gala','Granny Smith','Cosmic Crisp']},
    {n:'Tri-Peak', s:'Outside', b:.10, v:['Honeycrisp','Cosmic Crisp','Fuji']}
  ];
  const vbias = {'Honeycrisp':-.05,'Gala':.08,'Fuji':0,'Granny Smith':-.15,'Cosmic Crisp':-.08};
  /* a lot is one grower + variety + block; several loads are hauled from each */
  const lots = [];
  growers.forEach(gr => gr.v.forEach(v => lots.push({no:String(2401 + lots.length*6 + Math.floor(rnd()*5)), gr, variety:v, block:'Block ' + (3 + Math.floor(rnd()*20))})));
  /* 12-hour clock: 3:41 PM, or 3:41p where space is tight */
  const clock = (m, pm, am) => ((Math.floor(m/60) + 11) % 12 + 1) + ':' + String(m % 60).padStart(2,'0') + (m >= 720 ? pm : am);
  const out = []; let id = 4100;
  const today = new Date();
  for (let daysAgo = 6; daysAgo >= 0; daysAgo--){
    const d = new Date(today); d.setDate(today.getDate()-daysAgo);
    const n = 5 + Math.floor(rnd()*4);
    for (let j = 0; j < n; j++){
      const lot = pick(lots), gr = lot.gr, variety = lot.variety;
      const t = clamp(.5 + gr.b + vbias[variety] + g()*.22, 0, 1);
      const s = {p:[], st:[], ss:[]};
      for (let k = 0; k < 10; k++){
        s.p.push(clamp(19.2 - 5*t + g()*1.3, 11.5, 21.5));
        s.st.push(clamp(Math.round((1.6 + 3.8*t + g()*.9)*2)/2, 1, 6));
        s.ss.push(clamp(11.6 + 3*t + g()*.8, 9.5, 16.5));
      }
      id += 1 + Math.floor(rnd()*3);
      const mins = Math.round(390 + (j + rnd()*.8) * (660 / n));   /* 6:30am to 5:30pm, in arrival order */
      out.push({id, daysAgo, ts: -daysAgo*1440 + mins,
        time: clock(mins, ' PM', ' AM'), timeShort: clock(mins, 'p', 'a'),
        day: d.toLocaleDateString('en-US',{weekday:'short'}) + ' ' + (d.getMonth()+1) + '/' + d.getDate(),
        dayShort: (d.getMonth()+1) + '/' + d.getDate(),
        grower: gr.n, source: gr.s, variety,
        lot: lot.no, block: lot.block, bins: 24 + Math.floor(rnd()*36), samples: s});
    }
  }
  return out;
}
const mean = a => a.reduce((x,y) => x+y, 0) / a.length;
/* The one place data comes from. Swap the body for a fetch of the real feed; everything else only sees TICKETS. */
async function loadTickets(){
  return buildMockTickets().map(t => { KEYS.forEach(k => t[k] = mean(t.samples[k])); return t; });
}
let TICKETS = buildMockTickets().map(t => {
  KEYS.forEach(k => t[k] = mean(t.samples[k]));
  return t;
});

/* -------------------------------------------------------------------- state */
const state = {
  days: new Set([0]), groupBy: 'variety', sort: 'default',
  filters: {source:new Set(), grower:new Set(), variety:new Set()},
  drilled: null, selTicket: null, openOrb: null,
  sound: false, show: 'all', table: false
};
const $ = s => document.querySelector(s);
/* two frames later, or 80ms if the tab is not painting */
function nextFrame(fn){ let done = false; const run = () => { if (!done){ done = true; fn(); } }; requestAnimationFrame(() => requestAnimationFrame(run)); setTimeout(run, 80); }
const els = {tblBtn:$('#tblBtn'), tableWrap:$('#tableWrap'), resetBtn:$('#resetBtn'), sndBtn:$('#sndBtn'), days:$('#days'), lens:$('#lens'), orbs:$('#orbs'),  crumbs:$('#crumbs'),  stage:$('#stage'),
  stageIn:$('#stageIn'), deckP:$('#deckP'), deckC:$('#deckC'), pop:$('#pop'), down:$('#downBtn'), downLbl:$('#downLbl'), table:$('#table')};

function scope(except, anyDay){
  return TICKETS.filter(t => {
    if (!anyDay && !state.days.has(t.daysAgo)) return false;
    for (const k in state.filters){
      if (k === except) continue;
      const f = state.filters[k];
      if (f.size && !f.has(t[k])) return false;
    }
    return true;
  });
}
function summarize(ts){
  const o = {n: ts.length, bins: ts.reduce((a,t) => a+t.bins, 0)};
  KEYS.forEach(k => o[k] = ts.length ? mean(ts.map(t => t[k])) : NaN);
  return o;
}
/* daily mean per metric over the last seven days, oldest first; null where no loads */
function trendOf(ts){
  const o = {};
  KEYS.forEach(k => o[k] = [6,5,4,3,2,1,0].map(d => { const day = ts.filter(t => t.daysAgo === d); return day.length ? mean(day.map(t => t[k])) : null; }));
  return o;
}
/* loads: received date and time by default (oldest left), ticket number for Name, else the chosen measure */
const loadCmp = (a, b) => state.sort === 'default' ? a.ts - b.ts : state.sort === 'name' ? a.id - b.id : a[state.sort] - b[state.sort];
function computeGroups(){
  const m = new Map();
  scope().forEach(t => { const k = t[state.groupBy]; (m.get(k) || m.set(k, []).get(k)).push(t); });
  const week = state.groupBy === 'day' ? [] : scope(null, true);
  const gs = [...m].map(([key, ts]) => Object.assign(summarize(ts), {key, tickets: ts,
    label: state.groupBy === 'lot' ? 'Lot ' + key : key, sub: state.groupBy === 'lot' ? ts[0].grower : '',
    trend: trendOf(week.filter(t => t[state.groupBy] === key)),
    last: Math.max(...ts.map(t => t.ts))}));
  /* default: by each group's most recent load, oldest on the left, newest on the right */
  gs.sort((a,b) => state.sort === 'default' || (state.sort === 'name' && state.groupBy === 'day') ? a.last - b.last
    : state.sort === 'name' ? a.key.localeCompare(b.key, undefined, {numeric:true})
    : a[state.sort] - b[state.sort]);
  return gs;
}

/* ------------------------------------------------------------------- chips */
function tone(k, v){
  const m = METRICS[k], r = isDark() ? m.dark : m.light;
  const i = Math.max(0, Math.min(4, Math.floor((v - m.cdom[0]) / (m.cdom[1] - m.cdom[0]) * 5)));
  return `background:${r.f[i]};color:${r.i[i]}`;
}
const BIGTAG = {p:'P · lb', st:'St · 1–6', ss:'SS · °Bx'};
function chip(k, v, extra, big){
  return `<span class="chip${big ? ' big' : ''}" style="${tone(k, v)}"><small>${big ? BIGTAG[k] : METRICS[k].tag}</small><b>${v.toFixed(1)}</b>${extra || ''}</span>`;
}
/* all three measures, or one large with the other two as pills */
function chipSet(o, extraOf){
  const f = state.show;
  if (f === 'all') return `<span class="chips">${KEYS.map(k => chip(k, o[k], extraOf(k))).join('')}</span>`;
  return `<span class="chips">${chip(f, o[f], extraOf(f), true)}<span class="mrow">${KEYS.filter(k => k !== f).map(k => `<span class="mchip" style="${tone(k, o[k])}"><small>${METRICS[k].tag}</small>${o[k].toFixed(1)}</span>`).join('')}</span></span>`;
}
const MINSPAN = {p:1.6, st:1.2, ss:1.2};
function spark(k, series){
  const pts = series.map((v, i) => v === null ? null : [i, v]).filter(Boolean);
  if (pts.length < 2) return '<svg class="sp" viewBox="0 0 48 12"></svg>';
  const vs = pts.map(q => q[1]), mid = (Math.min(...vs) + Math.max(...vs)) / 2, half = Math.max((Math.max(...vs) - Math.min(...vs)) / 2, MINSPAN[k] / 2);
  const xy = pts.map(([i, v]) => [(3 + i / 6 * 42).toFixed(1), (10 - (v - (mid - half)) / (2 * half) * 8).toFixed(1)]);
  const e = xy[xy.length - 1];
  return `<svg class="sp" viewBox="0 0 48 12" preserveAspectRatio="none"><polyline points="${xy.map(q => q.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity=".8" vector-effect="non-scaling-stroke"/><circle cx="${e[0]}" cy="${e[1]}" r="1.8" fill="currentColor"/></svg>`;
}
function whisker(k, vals){
  const d = METRICS[k].dom, f = v => Math.max(0, Math.min(100, (v - d[0]) / (d[1] - d[0]) * 100));
  const a = f(Math.min(...vals)), b = f(Math.max(...vals));
  return `<span class="wh"><i style="left:${a.toFixed(1)}%;width:${Math.max(4, b - a).toFixed(1)}%"></i></span>`;
}
const groupChips = g => chipSet(g, k => state.groupBy === 'day' ? '' : spark(k, g.trend[k]));
const loadChips = t => chipSet(t, k => whisker(k, t.samples[k]));

/* ------------------------------------------------------------ days, legend */
/* days are a contiguous window; strip index 0 is six days ago, 6 is today */
const dayRange = () => { const v = [...state.days]; return {i0:6 - Math.max(...v), i1:6 - Math.min(...v)}; };
const setDays = (i0, i1) => { const d = new Set(); for (let i = i0; i <= i1; i++) d.add(6 - i); state.days = d; };
const sameDays = (i0, i1) => { const r = dayRange(); return r.i0 === i0 && r.i1 === i1; };
const segEl = $('#period'), segBtns = [...segEl.querySelectorAll('button')];
const segLens = document.createElement('span'), dayLens = document.createElement('span');
segLens.className = dayLens.className = 'glass';
segEl.prepend(segLens); els.days.appendChild(dayLens);
const dayCells = [];
for (let d = 6; d >= 0; d--){ const b = document.createElement('button'); b.className = 'dayc'; els.days.appendChild(b); dayCells.push(b); }
/* the strip always ends on today, so it is re-stamped on every refresh (the app may stay open past midnight) */
function stampDays(){
  dayCells.forEach((b, i) => {
    const d = 6 - i, dt = new Date(); dt.setDate(dt.getDate() - d);
    const wk = dt.toLocaleDateString('en-US', {weekday:'short'});
    b._label = `${wk} ${dt.getMonth()+1}/${dt.getDate()}`;
    b.innerHTML = `<span class="w">${d === 0 ? 'Today' : wk}</span><span class="d">${dt.getDate()}</span>`;
  });
}
stampDays();
const showEl = $('#show'), showBtns = [...showEl.querySelectorAll('button')], showLens = document.createElement('span');
showLens.className = 'glass'; showEl.prepend(showLens);
function renderShow(){
  const i = showBtns.findIndex(b => b.dataset.k === state.show);
  showBtns.forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  if (!showLens.classList.contains('drag')){ showLens.style.left = showBtns[i].offsetLeft + 'px'; showLens.style.width = showBtns[i].offsetWidth + 'px'; }
}
function presetOf(){ const r = dayRange(); return r.i1 === 6 ? segBtns.findIndex(b => +b.dataset.p === 7 - r.i0) : -1; }
function renderDays(){
  const r = dayRange(), solo = r.i0 === r.i1;
  dayCells.forEach((b, i) => {
    const n = TICKETS.filter(t => t.daysAgo === 6 - i).length, on = i >= r.i0 && i <= r.i1;
    b.classList.toggle('in', on); b.classList.toggle('none', !n);
    b.setAttribute('aria-pressed', on && solo); b.setAttribute('aria-label', `${b._label}, ${n} loads`);
  });
  if (!dayLens.classList.contains('drag')){
    const a = dayCells[r.i0], z = dayCells[r.i1];
    dayLens.style.left = a.offsetLeft + 'px';
    dayLens.style.width = (z.offsetLeft + z.offsetWidth - a.offsetLeft) + 'px';
  }
  const pi = presetOf();
  segBtns.forEach((b, i) => b.setAttribute('aria-pressed', i === pi));
  if (!segLens.classList.contains('drag')){
    segLens.style.opacity = pi < 0 ? 0 : 1;
    if (pi >= 0){ segLens.style.left = segBtns[pi].offsetLeft + 'px'; segLens.style.width = segBtns[pi].offsetWidth + 'px'; }
  }
}
/* drag a glass lens along its track: follows the finger, stretches with speed, snaps on release */
function glassDrag(track, lens, cells, o){
  let st = null;
  const at = x => { let best = 0; cells.forEach((c, i) => { if (x >= c.offsetLeft) best = i; }); return best; };
  track.addEventListener('pointerdown', e => {
    if (e.button) return;
    const lr = lens.getBoundingClientRect();
    st = {id:e.pointerId, x0:e.clientX, x:e.clientX - track.getBoundingClientRect().left, left0:lens.offsetLeft, drag:false, v:0, lx:e.clientX, lt:e.timeStamp,
      inLens:lens.style.opacity !== '0' && e.clientX >= lr.left && e.clientX <= lr.right};
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x0;
    if (!st.drag){
      if (Math.abs(dx) < 6) return;
      st.drag = true; lens.classList.add('drag'); lens.style.opacity = 1;
      if (!st.inLens){ const c = cells[at(st.x)]; lens.style.width = c.offsetWidth + 'px'; st.left0 = st.x - c.offsetWidth/2; o.grab(at(st.x)); }
    }
    st.v = .7*st.v + .3*((e.clientX - st.lx) / Math.max(1, e.timeStamp - st.lt)); st.lx = e.clientX; st.lt = e.timeStamp;
    const first = cells[0], last = cells[cells.length-1], w = lens.offsetWidth;
    const left = Math.max(first.offsetLeft, Math.min(last.offsetLeft + last.offsetWidth - w, st.left0 + dx));
    lens.style.left = left + 'px';
    lens.style.setProperty('--sx', (1 + Math.min(.22, Math.abs(st.v)*.14)).toFixed(3));
    o.move(left, w, at);
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    const was = st; st = null;
    if (was.drag){ lens.classList.remove('drag'); lens.style.removeProperty('--sx'); render(); }
    else if (e.type === 'pointerup') o.tap(at(was.x));
  };
  track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
  /* keyboard and assistive clicks arrive without pointer events */
  cells.forEach((c, i) => c.addEventListener('click', e => { if (e.detail === 0) o.tap(i); }));
}
/* one tick of feedback: a buzz where the device supports it, plus the optional click */
let actx = null;
function tick(){

}
/* ---------------------------------------------------------- saved views and Home
   A view is the period, grouping, order, measure and filters, written the same way as the link.
   Days are stored relative to today, so "Today" still means today tomorrow. Kept on this device. */
const BUILTIN_HOME = 'days=6-6&by=variety';
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const loadViews = () => store.get('fd-views', []).filter(v => v && v.name && v.q);
const saveViews = vs => store.set('fd-views', vs);
const homeView = () => store.get('fd-home', null) || BUILTIN_HOME;
function viewParams(){
  const r = dayRange(), q = new URLSearchParams();
  q.set('days', r.i0 + '-' + r.i1); q.set('by', state.groupBy);
  if (state.sort !== 'default') q.set('sort', state.sort);
  if (state.show !== 'all') q.set('show', state.show);
  for (const k in state.filters) if (state.filters[k].size) q.set(k, [...state.filters[k]].sort().join('|'));
  return q;
}
const viewString = () => viewParams().toString();
function applyView(str){ closeChild(); readParams(new URLSearchParams(str)); }
function isDefault(){ return viewString() === homeView() && state.drilled === null && !state.selTicket && !state.table; }
function resetView(){
  state.openOrb = null; applyView(homeView());
  els.resetBtn.classList.remove('go'); void els.resetBtn.offsetWidth; els.resetBtn.classList.add('go');
  tick(); renderOrbs(true); render();
}
function suggestName(){
  const r = dayRange(), n = r.i1 - r.i0 + 1;
  const when = r.i1 === 6 ? (n === 1 ? 'Today' : n + ' days') : dayCells[r.i0]._label.split(' ')[0] + (n > 1 ? '+' : '');
  const f = Object.values(state.filters).flatMap(x => [...x]);
  return (when + ' ' + (f.length ? f.join(' ') : DIMS[state.groupBy].label)).slice(0, 22);
}
/* the view lives in the address bar, so a link reopens exactly what you were looking at */
function writeURL(){
  const q = viewParams();
  if (state.table) q.set('table', '1');
  if (state.drilled !== null) q.set('open', state.drilled);
  if (state.selTicket) q.set('ticket', state.selTicket.id);
  try { history.replaceState(null, '', '#' + q.toString()); } catch (e) {}
}
function readParams(q){
  const d = /^([0-6])-([0-6])$/.exec(q.get('days') || '');
  if (d && +d[1] <= +d[2]) setDays(+d[1], +d[2]);
  if (DIMS[q.get('by')]) state.groupBy = q.get('by');
  state.sort = ['name','p','st','ss'].includes(q.get('sort')) ? q.get('sort') : 'default';
  state.show = KEYS.includes(q.get('show')) ? q.get('show') : 'all';
  state.table = q.get('table') === '1';
  for (const k in state.filters){
    const known = new Set(TICKETS.map(t => t[k]));
    state.filters[k] = new Set((q.get(k) || '').split('|').filter(v => known.has(v)));
  }
  state.drilled = q.has('open') ? q.get('open') : null;
  state.selTicket = TICKETS.find(t => String(t.id) === q.get('ticket')) || null;
}
/* a link wins; with no link the page opens on Home */
function readURL(){ readParams(new URLSearchParams(location.hash.length > 1 ? location.hash.slice(1) : homeView())); }
addEventListener('hashchange', () => { closeChild(); readURL(); render(); });
const menuBtn = $('#menuBtn'), menu = $('#menu');
function setMenu(open){
  menu.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open);
  if (!open){ $('#saveForm').hidden = true; $('#installHelp').hidden = true; }
  $('#homeClr').hidden = homeView() === BUILTIN_HOME;
}
menuBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
menu.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => setMenu(false));
/* Install: Chrome, Edge and Android hand us a prompt to show; Safari on iPhone and iPad has no such hook, so
   there the menu explains the two taps instead. Hidden once the page is already running as an app. */
const installBtn = $('#installBtn'), installHelp = $('#installHelp');
let installPrompt = null;
const isApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; installBtn.hidden = true; installHelp.hidden = true; });
installBtn.hidden = isApp();
installBtn.addEventListener('click', async () => {
  if (installPrompt){
    installPrompt.prompt();
    try { await installPrompt.userChoice; } catch (e) {}
    installPrompt = null; setMenu(false); return;
  }
  if (!installHelp.hidden){ installHelp.hidden = true; return; }
  const share = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M8 7l4-4 4 4"/><path d="M6 11v8.5h12V11"/></svg>';
  installHelp.innerHTML = isApple
    ? `In Safari, tap <b>Share</b> ${share} and then <b>Add to Home Screen</b>. It opens full screen with its own icon.`
    : isSecureContext
      ? 'Use the <b>install icon</b> at the right of the address bar, or the browser menu → <b>Install</b> / <b>Add to Home screen</b>.'
      : 'This browser only installs pages served over <b>https</b> (or localhost). Open the page that way and this button will install it directly.';
  installHelp.hidden = false;
});
const saveForm = $('#saveForm'), saveName = $('#saveName'), homeSet = $('#homeSet'), homeClr = $('#homeClr');
function openSaveForm(){
  state.openOrb = null; renderOrbs(true); setMenu(true);
  saveForm.hidden = false; saveName.value = suggestName();
  setTimeout(() => { saveName.focus(); saveName.select(); }, 60);
}
function commitSave(){
  const name = saveName.value.trim().slice(0, 22); if (!name){ saveName.focus(); return; }
  saveViews(loadViews().filter(v => v.name !== name).concat([{name, q:viewString()}]));   /* same name replaces */
  saveForm.hidden = true; setMenu(false); tick();
  state.openOrb = 'views'; renderOrbs(true);   /* show where it landed */
}
$('#saveBtn').addEventListener('click', () => { if (saveForm.hidden) openSaveForm(); else saveForm.hidden = true; });
$('#saveGo').addEventListener('click', commitSave);
saveName.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') commitSave(); if (e.key === 'Escape'){ saveForm.hidden = true; setMenu(false); } });
function flash(btn, txt){ const was = btn.textContent; btn.textContent = txt; setTimeout(() => { btn.textContent = was; setMenu(false); }, 900); }
homeSet.addEventListener('click', () => { store.set('fd-home', viewString()); tick(); render(); flash(homeSet, 'Home updated'); });
homeClr.addEventListener('click', () => { store.set('fd-home', null); tick(); render(); flash(homeClr, 'Built-in Home restored'); });
els.down.addEventListener('click', e => { e.stopPropagation(); down(); });
['pointerdown','pointerup'].forEach(t => { els.down.addEventListener(t, e => e.stopPropagation()); els.pop.addEventListener(t, e => e.stopPropagation()); });
els.pop.addEventListener('click', e => e.stopPropagation());
els.tblBtn.addEventListener('click', e => {
  e.stopPropagation(); state.table = !state.table; tick(); render();
  if (state.table) setTimeout(() => els.tableWrap.scrollIntoView({block:'nearest', behavior:'smooth'}), 60);
});
/* Refresh: reload the data and keep the view exactly as it is. Also runs when the app comes back to the
   front after a while, so an iPad left on the counter is not showing this morning's numbers. */
const refreshBtn = $('#refreshBtn'); let lastRefresh = Date.now(), noteTimer = 0;
async function refreshData(quiet){
  if (refreshBtn.classList.contains('busy')) return;
  refreshBtn.classList.add('busy'); const t0 = performance.now(); let ok = true;
  try { TICKETS = await loadTickets(); } catch (e) { ok = false; }
  await new Promise(r => setTimeout(r, Math.max(0, 500 - (performance.now() - t0))));   /* long enough to see it happened */
  refreshBtn.classList.remove('busy');
  if (ok){
    lastRefresh = Date.now(); stampDays();
    if (state.selTicket) state.selTicket = TICKETS.find(t => t.id === state.selTicket.id) || null;
  }
  lensNote = ok ? 'Updated ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : 'Could not refresh. Showing the last data.';
  clearTimeout(noteTimer); noteTimer = setTimeout(() => { lensNote = ''; renderLens(); }, ok ? 2600 : 6000);
  if (!quiet) tick();
  render();
}
refreshBtn.addEventListener('click', e => { e.stopPropagation(); refreshData(false); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastRefresh > 5 * 60 * 1000) refreshData(true); });
/* Theme: Auto follows the device; Light and Dark pin it. */
const themeBtn = $('#themeBtn');
function applyTheme(){
  if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  themeBtn.textContent = 'Theme: ' + theme[0].toUpperCase() + theme.slice(1);
  $('#themeColor').setAttribute('content', isDark() ? '#141413' : '#f5f4ef');
}
themeBtn.addEventListener('click', () => {
  theme = {auto:'light', light:'dark', dark:'auto'}[theme];
  store.set('fd-theme', theme); applyTheme(); tick(); render();
});
els.resetBtn.addEventListener('click', e => { e.stopPropagation(); resetView(); });
els.sndBtn.addEventListener('click', () => {
  state.sound = !state.sound;
  try { localStorage.setItem('fd-sound', state.sound ? '1' : '0'); } catch (e) {}
  tick(); render();
});
try { state.sound = localStorage.getItem('fd-sound') === '1'; } catch (e) {}
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (menu.classList.contains('open')) setMenu(false); else if (state.openOrb){ state.openOrb = null; renderOrbs(true); } else down(); } });
/* Turning the device (or crossing into the other layout) re-flows everything. Positions, sizes and the deck's
   scale already glide to their new values; the containers that CSS moves at once fade back in over the top. */
let wasSide = sideMQ.matches, wasTall = innerHeight > innerWidth;
function relayout(rebuildOrbs){ renderDays(); renderShow(); renderOrbs(!!rebuildOrbs); renderDecks(); }
/* iPad Safari fires resize while the rotation is still under way, when widths are not final yet. Controls placed
   from those stale numbers ended up in the wrong spots, so lay out again as things settle, and also whenever
   one of the measured boxes actually changes width. */
let settle = [];
function onViewportChange(){
  const flipped = wasSide !== sideMQ.matches || wasTall !== (innerHeight > innerWidth);
  wasSide = sideMQ.matches; wasTall = innerHeight > innerWidth;
  if (flipped){
    state.openOrb = null; setMenu(false);
    if (!calmMQ.matches){ const page = $('.page'); page.classList.add('reflow'); setTimeout(() => page.classList.remove('reflow'), 140); }
  }
  relayout(true);
  settle.forEach(clearTimeout);
  settle = [60, 180, 400, 800].map(ms => setTimeout(() => relayout(false), ms));
}
addEventListener('resize', onViewportChange);
addEventListener('orientationchange', onViewportChange);
/* belt and braces: installed iOS apps do not always send resize on rotation */
sideMQ.addEventListener('change', onViewportChange);
matchMedia('(orientation: portrait)').addEventListener('change', onViewportChange);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onViewportChange);
if (window.visualViewport) visualViewport.addEventListener('resize', () => { settle.push(setTimeout(() => relayout(false), 50)); });
if (window.ResizeObserver){
  const seen = new Map();
  const ro = new ResizeObserver(entries => {
    let changed = false;
    entries.forEach(en => { const w = Math.round(en.contentRect.width); if (seen.get(en.target) !== w){ seen.set(en.target, w); changed = true; } });
    if (changed) settle.push(setTimeout(() => relayout(false), 0));   /* widths only: our own height changes must not loop */
  });
  [els.orbs, els.stage, $('.top'), els.days, segEl].forEach(el => ro.observe(el));
}
darkMQ.addEventListener('change', () => { applyTheme(); render(); });
theme = ['light','dark'].includes(store.get('fd-theme', 'auto')) ? store.get('fd-theme', 'auto') : 'auto';
applyTheme(); readURL(); render();
})();
</script>
