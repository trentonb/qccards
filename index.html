<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColor" content="#141413">

<title>Load ticket fan deck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Fan deck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#faf9f5;
  --ink:#1a1a18; --ink-2:#55544f; --ink-3:#8a8882;
  --line:rgba(20,20,18,.12); --line-2:rgba(20,20,18,.26);
  --accent:#185FA5; --accent-bg:#E6F1FB; --accent-line:#85B7EB;
  --shadow:0 1px 3px rgba(0,0,0,.10);
  --glass-track:rgba(255,255,255,.45);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));
  --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.3));
  --glass-edge:rgba(255,255,255,.95);
  --glass-shadow:0 4px 14px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.10),inset 0 1px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.05);
}
/* Theme: follows the device unless the settings menu pins it (data-theme on <html>) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1f1f1d; --surface-2:#262624;
    --ink:#f0efea; --ink-2:#c3c2b7; --ink-3:#8a8882;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.28);
    --accent:#85B7EB; --accent-bg:#0C2E4F; --accent-line:#185FA5;
    --shadow:0 1px 3px rgba(0,0,0,.5);
    --glass-track:rgba(255,255,255,.06);
    --glass-fill:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));
    --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
    --glass-edge:rgba(255,255,255,.30);
    --glass-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.40),inset 0 -3px 6px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1f1f1d; --surface-2:#262624;
  --ink:#f0efea; --ink-2:#c3c2b7; --ink-3:#8a8882;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.28);
  --accent:#85B7EB; --accent-bg:#0C2E4F; --accent-line:#185FA5;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --glass-track:rgba(255,255,255,.06);
  --glass-fill:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.09));
  --glass-fill-drag:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
  --glass-edge:rgba(255,255,255,.30);
  --glass-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.40),inset 0 -3px 6px rgba(0,0,0,.25);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
/* The flat page colour sits on <html>; the corner glows are a fixed layer above it. In a Safari tab the area
   around the clock and Dynamic Island is Safari's own bar, tinted with this flat colour, so the glows fade out
   over the top edge to meet it without a seam. Installed as an app the page draws under the island itself, so
   there the glows run all the way up. */
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vw 42vh at 8% 0%,rgba(214,48,49,.15),transparent 70%),radial-gradient(50vw 40vh at 96% 6%,rgba(86,168,64,.14),transparent 70%),radial-gradient(70vw 50vh at 50% 100%,rgba(186,117,23,.09),transparent 70%);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 110px);mask-image:linear-gradient(180deg,transparent 0,#000 110px)}
@media (display-mode: standalone){body::before{-webkit-mask-image:none;mask-image:none}}
body{background:transparent;min-height:100vh;color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
/* installed as an app the page runs under the status bar, so keep clear of the notch / Dynamic Island */
.page{max-width:2000px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
/* top bar: Home / Refresh / period on the left, saved views in the middle, days and the menu on the right */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px}
.top > .top-l{grid-column:1;grid-row:1}
.top > .days{grid-column:3;grid-row:1}
.top > .menu-w{grid-column:4;grid-row:1}
/* saved views: one glass pill in the top bar that opens into a sheet of every saved view */
.views{grid-column:2;justify-self:center;max-width:100%;min-width:0}
.vbtn{display:inline-flex;align-items:center;gap:8px;max-width:100%;height:50px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);transition:transform .3s cubic-bezier(.3,1.7,.5,1),color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.vbtn:active{transform:scale(.95)}
.vbtn.on{color:var(--ink);font-weight:600}
.vbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vbtn svg{flex:none}
.vbtn .chev{transition:transform .35s cubic-bezier(.3,1.5,.5,1);opacity:.6}
.vbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.vbtn em{font-style:normal;font-size:11px;font-weight:600;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:999px;background:var(--line);color:var(--ink-2)}
/* the sheet grows out of the pill; its chips then land one after another */
.page{position:relative}
.vpanel{position:absolute;left:50%;z-index:70;width:min(780px,calc(100% - 24px));transform:translateX(-50%);padding:14px 16px 16px;border-radius:24px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 24px 60px rgba(0,0,0,.35);-webkit-clip-path:circle(0 at var(--ox,50%) 0);clip-path:circle(0 at var(--ox,50%) 0);opacity:0;pointer-events:none;transition:clip-path .32s cubic-bezier(.4,0,.6,1),-webkit-clip-path .32s cubic-bezier(.4,0,.6,1),opacity .2s .12s}
.vpanel.open{-webkit-clip-path:circle(150% at var(--ox,50%) 0);clip-path:circle(150% at var(--ox,50%) 0);opacity:1;pointer-events:auto;transition:clip-path .6s cubic-bezier(.2,.8,.2,1),-webkit-clip-path .6s cubic-bezier(.2,.8,.2,1),opacity .15s}
.vp-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.vp-h .btn{min-height:34px;text-transform:none;letter-spacing:0}
.vp-g{display:flex;flex-wrap:wrap;gap:8px;max-height:min(52vh,420px);overflow-y:auto;padding:2px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pick .vp-g{max-height:min(62vh,560px)}
.vchip{display:inline-flex;align-items:center;gap:7px;height:46px;padding:0 18px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--ink);border:1px solid var(--line-2);background:var(--surface-2);opacity:0;transform:translateY(-14px) scale(.8);transition:opacity .12s,transform .12s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.vpanel.open .vchip{opacity:1;transform:none;transition:opacity .3s,transform .55s cubic-bezier(.3,1.55,.5,1),background .2s,border-color .2s;transition-delay:calc(60ms + var(--i,0) * 26ms),calc(60ms + var(--i,0) * 26ms),0s,0s}
.vchip:active{transform:scale(.94)!important}
.vchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.vchip.add{border-style:dashed;color:var(--ink-2);background:transparent}
.vchip.form{cursor:default;padding:0 5px 0 6px;gap:6px;border-style:solid;border-color:var(--ink);background:var(--surface);animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.vchip.form input{width:min(200px,46vw);height:34px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none}
.vchip.form button{height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.vchip.fresh{animation:land .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{scale:.6}60%{scale:1.12}100%{scale:1}}
.vchip svg{flex:none;opacity:.75}
.vchip .vx{display:none;width:26px;height:26px;margin:0 -10px 0 2px;border-radius:50%;align-items:center;justify-content:center;font-size:16px;line-height:1;background:#c0392b;color:#fff}
.vpanel.edit .vchip:not(.add){animation:jig .28s ease-in-out infinite alternate}
.vpanel.edit .vchip .vx{display:inline-flex}
@keyframes jig{from{rotate:-1.2deg}to{rotate:1.2deg}}
@media (prefers-reduced-motion: reduce){.vpanel.edit .vchip{animation:none}}
/* picker: a long filter (growers) opens as a searchable sheet instead of a ring of orbs */
.vpanel.pick{left:0;transform:none;width:auto;-webkit-clip-path:circle(0 at var(--ox,0) var(--oy,0));clip-path:circle(0 at var(--ox,0) var(--oy,0))}
.vpanel.pick.open{-webkit-clip-path:circle(160% at var(--ox,0) var(--oy,0));clip-path:circle(160% at var(--ox,0) var(--oy,0))}
.pk-s{display:flex;gap:8px;margin:0 0 10px}
.pk-s input{flex:1;min-width:0;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);font:inherit;font-size:16px;outline:none}
.pk-s input:focus{border-color:var(--ink-2)}
.pk-sec{flex-basis:100%;margin:6px 2px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.pk-sec:first-child{margin-top:0}
.vchip em{font-style:normal;font-size:12px;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
.vchip.zero{opacity:.38!important;cursor:default}
.vchip.pk{height:42px;padding:0 15px}
.vp-e{margin:6px 2px 0;font-size:13px;color:var(--ink-2)}
/* upright iPad: the top row is full, so the pill takes its own row */
@media (min-width:701px) and (max-width:899px){.views{grid-column:1 / -1;grid-row:2}}
.menu-w{position:relative;flex:none}
.menu{position:absolute;right:0;top:54px;z-index:60;min-width:190px;padding:6px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);box-shadow:0 14px 34px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px;transform-origin:100% 0;transform:scale(.6);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .18s}
.menu.open{transform:none;opacity:1;pointer-events:auto}
.mi{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:11px;background:transparent;font-size:14px;text-align:left;cursor:pointer}
.mi[hidden]{display:none}
.mi:hover{background:var(--surface-2)}
.msep{height:1px;margin:4px 8px;background:var(--line)}
.mhelp{margin:0 8px 8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px;line-height:1.45;color:var(--ink-2)}
.mhelp[hidden]{display:none}
.mhelp b{color:var(--ink);font-weight:600}
.mhelp svg{vertical-align:-4px;margin:0 2px}
.menu{min-width:250px}
.mi.live::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.top-l{display:flex;align-items:center;gap:10px}
.reset{width:46px;height:46px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:var(--ink-3);border:1px solid var(--line);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);transition:transform .3s cubic-bezier(.3,1.7,.5,1),color .2s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.reset.live{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.reset:active{transform:scale(.88)}
.reset.busy svg{animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.reset.go svg{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
/* glass controls: a translucent track with a draggable lens */
.seg,.days{position:relative;display:inline-flex;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.seg button,.dayc{position:relative;z-index:2;border:0;background:transparent;cursor:pointer;color:var(--ink-2);transition:color .25s;-webkit-tap-highlight-color:transparent}
.seg button{min-height:40px;padding:6px 16px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.dayc{width:clamp(42px,12.2vw,54px);height:46px;padding:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dayc .w{font-size:10px}
.dayc .d{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.dayc.in{color:var(--ink)}
.dayc.in .d{font-weight:700}
.dayc.none .d{color:var(--ink-3);font-weight:400}
.glass{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;z-index:1;pointer-events:none;background:var(--glass-fill);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8);transform:scale(1);transition:left .55s cubic-bezier(.3,1.45,.5,1),width .55s cubic-bezier(.3,1.45,.5,1),transform .4s cubic-bezier(.3,1.7,.5,1),opacity .25s}
.glass.drag{transition:transform .18s ease-out,opacity .25s,width .2s;transform:scale(calc(1.06 * var(--sx,1)),calc(1.24 / var(--sx,1)));background:var(--glass-fill-drag)}
/* upright iPad: Home, Refresh, period, days and the menu share one row */
@media (min-width:701px) and (max-width:899px){.dayc{width:clamp(40px,5.6vw,46px)}.top{gap:8px}.top-l{gap:8px}.reset{width:40px;height:40px}.seg button{padding:6px 12px}}
@media (max-width:700px){.top{display:flex;flex-wrap:wrap;justify-content:center}.top .days{order:3}.menu-w{order:2}.views{order:4}.views.empty{display:none}.vbtn{height:42px}.wide-only{display:none}}

.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* layout: filters left, fan right on tablets and up */
.layout{margin-top:14px;transition:opacity .5s ease}
.top{transition:opacity .5s ease}
.page.reflow .layout,.page.reflow .top{opacity:0;transition:none}
.btn.live{color:var(--bg);background:var(--ink);border-color:var(--ink)}
/* wide screens (desktop, iPad on its side): filters in a column on the left. An upright iPad keeps them in a row
   so the deck gets the full width. */
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:clamp(204px,16vw,280px) minmax(0,1fr);gap:16px;align-items:start}
  .side{position:sticky;top:12px}
}

/* orbs */
.orbs{position:relative;height:112px;transition:height .45s cubic-bezier(.2,.8,.2,1);margin-top:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.orb-cap{position:absolute;top:0;transition:top .45s cubic-bezier(.2,.8,.2,1);font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;transform:translateX(-50%);white-space:nowrap}
.orb{position:absolute;left:0;top:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;line-height:1.15;cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);transition:transform .5s cubic-bezier(.25,.9,.3,1.15),opacity .3s,background .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
@media (hover:hover){.orb:hover{border-color:var(--ink-2)}}
.orb .o1{font-size:calc(11px * var(--k,1));color:var(--ink-2)}
.orb .o2{font-size:calc(13px * var(--k,1));font-weight:600;color:var(--ink)}
.orb.on{background:var(--accent-bg);border-color:var(--accent-line)}
.orb.on .o1,.orb.on .o2{color:var(--accent)}
.orb.open{border:2px solid var(--ink)}
.orb.lead{background:var(--ink);border-color:var(--ink)}
.orb.lead .o1{color:var(--bg);opacity:.75}
.orb.lead .o2{color:var(--bg)}
.orb.zero{background:transparent;box-shadow:none;cursor:default}
.orb.zero .o1,.orb.zero .o2{color:var(--ink-3)}
.o-x{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:none;align-items:center;justify-content:center;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.o-x::after{content:"";position:absolute;inset:-7px;border-radius:50%}
.orb.on .o-x{display:flex;animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.o-x:active{transform:scale(.85)}

/* toolbar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;min-height:36px}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.crumbs .hint{font-size:13px;color:var(--ink-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;min-height:38px;padding:5px 14px;font-size:13px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.btn:active{transform:scale(.94)}
.btn:hover{border-color:var(--ink-2)}
.grow{flex:1}
.bar label{font-size:13px;color:var(--ink-2)}
.bar select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;min-height:38px;padding:5px 8px;font-size:13px}

/* lens: full-size readout of the blade under the pointer or finger */
.lens{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;margin-top:8px;white-space:nowrap;overflow:hidden}
.lens.idle{color:var(--ink-3);font-size:13px}
.lens .l-n{font-weight:600;flex:none}
.lens .l-m{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lens .pill{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;animation:pop .28s cubic-bezier(.3,1.7,.5,1)}
.lens .pill small{font-weight:400;font-size:11px;margin-right:4px;opacity:.85}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}

/* stage + cards: a shallow arc around a pivot far below the screen, so every card stays nearly upright */
.stage{position:relative;overflow:hidden;overflow:clip;height:320px;transition:height .7s cubic-bezier(.3,.8,.2,1);margin-top:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage-in{position:absolute;left:50%;top:0;width:var(--dw,860px);height:520px;margin-left:calc(var(--dw,860px) / -2);transform-origin:50% 0;transform:scale(var(--s,1));transition:transform .6s cubic-bezier(.3,.8,.2,1)}
.deck{position:absolute;left:50%;top:0;width:0;height:0;--R:1300px;transition:transform .7s cubic-bezier(.3,.8,.2,1)}
#deckC{z-index:5}
/* a crowded deck keeps its cards readable and runs off the sides instead; drag to spin it */
.deck.spin .blade{transition:opacity .4s,border-color .2s,box-shadow .2s}
.stage.ovf{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);cursor:grab}
.blade{position:absolute;bottom:0;width:120px;height:224px;left:-60px;display:flex;flex-direction:column;gap:4px;padding:8px 8px 7px;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;cursor:pointer;user-select:none;box-shadow:var(--shadow);transform-origin:50% 100%;--a:0deg;--lift:0px;--sc:1;transform:translateY(var(--R)) rotate(var(--a)) translateY(calc(var(--lift) - var(--R))) scale(var(--sc));transition:transform .5s cubic-bezier(.25,.9,.3,1.1),opacity .4s,border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.blade.load{width:114px;left:-57px}
.blade.enter{opacity:0}
.blade.hot{--lift:-16px;--sc:1.14;z-index:500!important;border-color:var(--ink-2);box-shadow:0 12px 30px rgba(0,0,0,.28)}
.blade.sel,.blade.sel.hot{--lift:-24px;--sc:1.1;border-color:var(--ink);border-width:1.5px}
.blade.up{--lift:-12px;border-color:var(--ink);border-width:2px}
.blade.dim{opacity:.55}
.blade.dim.hot{opacity:1}
.c-name{font-size:14.5px;font-weight:650;letter-spacing:-.01em;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-sub{font-size:12px;color:var(--ink-2);line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.c-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.c-id{font-size:18px;font-weight:700;line-height:20px;font-variant-numeric:tabular-nums}
/* values sit on the left of each chip: when cards overlap, the left edge is the part that stays visible */
.chips{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.chip{border-radius:9px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:6px;padding:4px 7px 5px;line-height:1;font-variant-numeric:tabular-nums}
.chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.chip small{grid-column:1 / -1;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.chip b{font-size:25px;font-weight:700;letter-spacing:-.02em}
.load .chip b{font-size:24px}
.sp{display:block;width:100%;height:18px;overflow:visible}
.wh{position:relative;display:block;height:5px;width:100%;border-radius:3px;background:color-mix(in srgb,currentColor 22%,transparent)}
.wh i{position:absolute;top:0;bottom:0;border-radius:3px;background:currentColor;opacity:.85}
.wh i.rg{opacity:.32}
.pm{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;margin-left:5px;opacity:.9}
/* one-measure mode: a single large value, the other two as small pills */
/* cards never overlap in this mode, so the big value can sit dead centre */
.chip.big{padding:6px 8px 7px;justify-items:center;text-align:center}
.chip.big small{justify-self:center}
.chip.big b{font-size:44px;grid-column:1 / -1;justify-self:center}
.chip.big .sp{grid-column:1 / -1;height:22px;margin-top:5px}
.chip.big .wh{grid-column:1 / -1;margin-top:7px}
.mrow{display:flex;gap:4px}
.mchip{flex:1 1 0;min-width:0;overflow:hidden;border-radius:7px;font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:20px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.mchip small{font-size:9.5px;font-weight:600;letter-spacing:.02em;opacity:.8;margin-right:2px;text-transform:uppercase}
.seg.small button{min-height:34px;padding:4px 13px}

/* ticket detail: rises out of the top of the selected load's card */
.stage-wrap{position:relative;transition:margin-top .6s cubic-bezier(.3,.8,.2,1)}
/* Drawn outside the scaled deck and revealed with a clip instead of a scale: text that is scaled up
   from a small bitmap stays blurry on iPad Safari. */
.pop{position:absolute;left:0;top:0;z-index:40;box-sizing:border-box;padding:12px 14px 10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;font-size:13.5px;color:var(--ink-2);opacity:0;pointer-events:none;transform:translateY(18px);-webkit-clip-path:circle(0 at var(--ox,50%) 100%);clip-path:circle(0 at var(--ox,50%) 100%);transition:clip-path .5s cubic-bezier(.3,.9,.3,1),-webkit-clip-path .5s cubic-bezier(.3,.9,.3,1),transform .5s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.pop.on{opacity:1;pointer-events:auto;transform:none;-webkit-clip-path:circle(160% at var(--ox,50%) 100%);clip-path:circle(160% at var(--ox,50%) 100%)}
.pop.done{-webkit-clip-path:none;clip-path:none;box-shadow:0 14px 34px rgba(0,0,0,.30)}
.pop-stem{position:absolute;top:100%;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:0 0 2px 2px}
/* compact (phone): title, facts as a wrapping line, then the measures */
.pop-t{font-size:1.35em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding-right:34px}
.pop-dl{margin:4px 0 2px;display:flex;flex-wrap:wrap;gap:2px 12px}
.pop-dl div{display:flex;gap:5px;align-items:baseline}
.pop-dl dt{font-size:.82em;color:var(--ink-3)}
.pop-dl dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.pop-r{display:grid;grid-template-columns:6.2em minmax(0,1fr) 4.6em;align-items:center;gap:10px;margin-top:6px}
.pop-r small{display:block;font-size:.8em;font-weight:400;color:var(--ink-3)}
.pop-v{text-align:right;font-size:1.3em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.pop-v small{font-size:.58em}
.pop-n{margin:8px 0 0;font-size:.82em;color:var(--ink-3)}
/* roomy (tablet, desktop): two columns, bigger type, taller sample strips */
.pop.wide{padding:20px 24px 18px;border-radius:20px}
.pop.wide .pop-grid{display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr);gap:30px;align-items:start}
.pop.wide .pop-t{font-size:1.75em;letter-spacing:-.01em;margin-bottom:10px}
.pop.wide .pop-dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.pop.wide .pop-dl div{display:block}
.pop.wide .pop-dl div:nth-child(6){grid-column:1 / -1}
.pop.wide .pop-dl dt{font-size:.74em;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
.pop.wide .pop-dl dd{font-size:1.05em;font-weight:600}
.pop.wide .pop-main{padding-right:30px}
/* each measure: name and value on one line, the sample strip full width beneath it */
.pop.wide .pop-r{grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;margin-top:0;padding:10px 0 8px;border-top:1px solid var(--line)}
.pop.wide .pop-r svg{grid-column:1 / -1;grid-row:2}
.pop.wide .pop-r:first-child{border-top:0;padding-top:2px}
.pop.wide .pop-l{font-size:1.02em;color:var(--ink);font-weight:600}
.pop.wide .pop-v{font-size:1.75em;display:flex;flex-direction:row-reverse;align-items:baseline;gap:10px}
.pop.wide .pop-v small{font-size:.45em}
.pop.wide .pop-l small{display:inline;margin-left:6px}
.pop.wide .pop-n{margin-top:10px}
.pop-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;cursor:pointer;padding:0;color:var(--ink-2)}
/* go back down a level */
.down{position:absolute;left:50%;bottom:6px;z-index:30;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink);border:1px solid var(--line-2);background:var(--glass-track);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:var(--shadow);transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.3,1.5,.5,1),opacity .25s;-webkit-tap-highlight-color:transparent}
.down.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.down:active{transform:translate(-50%,0) scale(.94)}
.down svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){.down svg{animation:none}}

/* table */
.reset.tbl{width:40px;height:40px}
/* the table unrolls open and rolls shut: a 0fr -> 1fr grid row animates to the table's real height */
.tw-o{display:grid;grid-template-rows:0fr;margin-top:0;opacity:0;transform:translateY(-10px) scale(.985);transform-origin:50% 0;pointer-events:none;transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1),margin-top .45s,opacity .3s,transform .45s cubic-bezier(.4,0,.2,1)}
.tw-o.open{grid-template-rows:1fr;margin-top:12px;opacity:1;transform:none;pointer-events:auto;transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1),margin-top .55s,opacity .35s .05s,transform .55s cubic-bezier(.3,1.3,.5,1)}
.tw{min-height:0;overflow-x:auto;overflow-y:hidden;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tw-o:not(.open) .tw{border-color:transparent;border-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:12px}
td.num,th.num{text-align:right}
th{padding:0}
button.th{width:100%;padding:9px 12px;border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink-2);text-align:inherit;cursor:pointer;white-space:nowrap}
button.th:hover,button.th.on{color:var(--ink)}
thead th{position:sticky;top:0;background:var(--surface);z-index:1}
tr:last-child td{border-bottom:0}
@media (max-width:560px){
  .page{padding-top:calc(14px + env(safe-area-inset-top))}

  .reset{width:38px;height:38px}
  .top-l{gap:6px}
  .top-l{gap:8px}
  .crumbs .hint,.crumbs .btn{display:none}   /* the down arrow under the deck already goes back */
  .bar{flex-wrap:nowrap}
  .crumbs{min-width:0;flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
  .side{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}

  .side .btn{flex:none;min-height:36px;padding:4px 12px}
  .lens{height:38px;margin-top:2px}
  .lens.idle{font-size:12px}
  .orb{padding:2px}
  .o-x{width:22px;height:22px;top:-6px;right:-6px;font-size:13px}
  .orb .o2{font-size:12px}
}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="page">

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ metrics */
const METRICS = {
  p:  {name:'Pressure', tag:'P', unit:'lb', dom:[11,22], cdom:[13.5,19.5], band:[15,18], dot:'#378ADD',
       light:{f:['#E6F1FB','#B5D4F4','#85B7EB','#378ADD','#185FA5'], i:['#042C53','#042C53','#042C53','#042C53','#E6F1FB']},
       dark: {f:['#042C53','#0C447C','#185FA5','#378ADD','#85B7EB'], i:['#B5D4F4','#E6F1FB','#E6F1FB','#042C53','#042C53']}},
  st: {name:'Starch', tag:'St', unit:'1–6', dom:[1,6], cdom:[1.5,5.5], band:[2,4], dot:'#D4537E',
       light:{f:['#FBEAF0','#F4C0D1','#ED93B1','#D4537E','#993556'], i:['#4B1528','#4B1528','#4B1528','#4B1528','#FBEAF0']},
       dark: {f:['#4B1528','#72243E','#993556','#D4537E','#ED93B1'], i:['#F4C0D1','#FBEAF0','#FBEAF0','#4B1528','#4B1528']}},
  ss: {name:'Soluble solids', tag:'SS', unit:'°Bx', dom:[9,17], cdom:[11.5,15], band:[12,14.5], dot:'#BA7517',
       light:{f:['#FAEEDA','#FAC775','#EF9F27','#BA7517','#854F0B'], i:['#412402','#412402','#412402','#412402','#FAEEDA']},
       dark: {f:['#412402','#633806','#854F0B','#BA7517','#EF9F27'], i:['#FAC775','#FAEEDA','#FAEEDA','#412402','#412402']}}
};
const KEYS = ['p','st','ss'];
const DIMS = {
  grower:{label:'Grower', plural:'growers'},
  lot:{label:'Lot', plural:'lots'},
  variety:{label:'Variety', plural:'varieties'},
  source:{label:'Source', plural:'sources'},
  day:{label:'Day', plural:'days'}
};
const VCODE = {'Honeycrisp':'HC','Gala':'GA','Fuji':'FJ','Granny Smith':'GS','Cosmic Crisp':'CC'};
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let theme = 'auto';   /* auto | light | dark */
const isDark = () => theme === 'dark' || (theme === 'auto' && darkMQ.matches);
const calmMQ = matchMedia('(prefers-reduced-motion: reduce)');

/* --------------------------------------------------------------------- data */
/* Ticket shape: {id, daysAgo, ts (minutes, for ordering), time, day, dayShort, grower, source, variety, block, bins,
   lot, samples:{p:[],st:[],ss:[]}}. Averages are derived below. */
function buildMockTickets(){
  let seed = 41;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const g = () => (rnd()+rnd()+rnd()-1.5)*1.15;
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(rnd()*a.length)];
  /* a realistic spread: a few company (captive) orchards and a long list of outside growers */
  const V = ['Honeycrisp','Gala','Fuji','Granny Smith','Cosmic Crisp'];
  const names = [['Home Ranch','Captive'], ['River Bench','Captive'], ['North Forty','Captive'], ['Canal Block','Captive'],
    ['Alder Creek','Outside'], ['Kessler Fruit','Outside'], ['Tri-Peak','Outside'], ['Basalt Ridge','Outside'], ['Bennett & Sons','Outside'],
    ['Blue Heron','Outside'], ['Cascade View','Outside'], ['Cold Spring','Outside'], ['Dry Gulch','Outside'], ['Eagle Rock','Outside'],
    ['Foster Orchards','Outside'], ['Garcia Family','Outside'], ['High Line','Outside'], ['Icicle Fruit','Outside'], ['Juniper Flat','Outside'],
    ['Larkspur','Outside'], ['Mission Hill','Outside'], ['Nakamura','Outside'], ['Orchard Pass','Outside'], ['Pine Hollow','Outside'],
    ['Quail Run','Outside'], ['Sagebrush','Outside'], ['Twin Rivers','Outside'], ['Wenas Valley','Outside']];
  const growers = names.map(([n, s]) => {
    const v = V.filter(() => rnd() < .45); if (!v.length) v.push(pick(V));
    return {n, s, b:(rnd() - .5) * .4, v};
  });
  const vbias = {'Honeycrisp':-.05,'Gala':.08,'Fuji':0,'Granny Smith':-.15,'Cosmic Crisp':-.08};
  /* a lot is one grower + variety + block; several loads are hauled from each */
  const lots = [];
  growers.forEach(gr => gr.v.forEach(v => lots.push({no:String(2401 + lots.length*6 + Math.floor(rnd()*5)), gr, variety:v, block:'Block ' + (3 + Math.floor(rnd()*20))})));
  /* 12-hour clock: 3:41 PM, or 3:41p where space is tight */
  const clock = (m, pm, am) => ((Math.floor(m/60) + 11) % 12 + 1) + ':' + String(m % 60).padStart(2,'0') + (m >= 720 ? pm : am);
  const out = []; let id = 4100;
  const today = new Date();
  for (let daysAgo = 6; daysAgo >= 0; daysAgo--){
    const d = new Date(today); d.setDate(today.getDate()-daysAgo);
    const n = 14 + Math.floor(rnd()*8);
    for (let j = 0; j < n; j++){
      const lot = pick(lots), gr = lot.gr, variety = lot.variety;
      const t = clamp(.5 + gr.b + vbias[variety] + g()*.22, 0, 1);
      const s = {p:[], st:[], ss:[]};
      for (let k = 0; k < 10; k++){
        s.p.push(clamp(19.2 - 5*t + g()*1.3, 11.5, 21.5));
        s.st.push(clamp(Math.round((1.6 + 3.8*t + g()*.9)*2)/2, 1, 6));
        s.ss.push(clamp(11.6 + 3*t + g()*.8, 9.5, 16.5));

    grid.appendChild(add);
  }
  if (viewsFresh){ const el = [...grid.querySelectorAll('.vchip')].find(b => b.title.replace(' (Home)', '') === viewsFresh); if (el) el.classList.add('fresh'); viewsFresh = null; }
  if (!vs.length){ const n = document.createElement('p'); n.className = 'vp-e'; n.textContent = 'Set the period, grouping and filters you want, then save it here to come back in one tap.'; grid.appendChild(n); }
}
function setViews(open){

  viewsOpen = open; if (!open){ viewsEdit = false; viewsSaving = false; }

    setMenu(false); setPicker(null); state.openOrb = null; renderOrbs(true);

    panel.style.top = (top.offsetTop + top.offsetHeight + 8) + 'px';
    const pr = panel.getBoundingClientRect(), br = btn.getBoundingClientRect();
    panel.style.setProperty('--ox', (br.left + br.width / 2 - pr.left).toFixed(1) + 'px');

}
$('#viewsBtn').addEventListener('click', e => { e.stopPropagation(); setViews(!viewsOpen); });
$('#vpanel').addEventListener('click', e => e.stopPropagation());
$('#vpEdit').addEventListener('click', e => { e.stopPropagation(); viewsEdit = !viewsEdit; tick(); renderViews(); });
document.addEventListener('click', () => { if (viewsOpen) setViews(false); });
function suggestName(){
  const r = dayRange(), n = r.i1 - r.i0 + 1;
  const when = r.i1 === 6 ? (n === 1 ? 'Today' : n + ' days') : dayCells[r.i0]._label.split(' ')[0] + (n > 1 ? '+' : '');
  const f = Object.values(state.filters).flatMap(x => [...x]);
  return (when + ' ' + (f.length ? f.join(' ') : DIMS[state.groupBy].label)).slice(0, 22);
}
/* the view lives in the address bar, so a link reopens exactly what you were looking at */
function writeURL(){
  const q = viewParams();
  if (state.table) q.set('table', '1');
  if (state.drilled !== null) q.set('open', state.drilled);
  if (state.selTicket) q.set('ticket', state.selTicket.id);
  try { history.replaceState(null, '', '#' + q.toString()); } catch (e) {}
}
function readParams(q){
  const d = /^([0-6])-([0-6])$/.exec(q.get('days') || '');
  if (d && +d[1] <= +d[2]) setDays(+d[1], +d[2]);
  if (DIMS[q.get('by')]) state.groupBy = q.get('by');
  state.sort = ['name','p','st','ss'].includes(q.get('sort')) ? q.get('sort') : 'default';
  state.show = KEYS.includes(q.get('show')) ? q.get('show') : 'all';
  state.table = q.get('table') === '1';
  for (const k in state.filters){
    const known = new Set(TICKETS.map(t => t[k]));
    state.filters[k] = new Set((q.get(k) || '').split('|').filter(v => known.has(v)));
  }
  state.drilled = q.has('open') ? q.get('open') : null;
  state.selTicket = TICKETS.find(t => String(t.id) === q.get('ticket')) || null;
}
/* a link wins; with no link the page opens on Home */

addEventListener('hashchange', () => { closeChild(); readURL(); render(); });
const menuBtn = $('#menuBtn'), menu = $('#menu');

menu.addEventListener('click', e => e.stopPropagation());

/* Install: Chrome, Edge and Android hand us a prompt to show; Safari on iPhone and iPad has no such hook, so

const installBtn = $('#installBtn'), installHelp = $('#installHelp');
let installPrompt = null;
const isApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; installBtn.hidden = true; installHelp.hidden = true; });
installBtn.hidden = isApp();
installBtn.addEventListener('click', async () => {
  if (installPrompt){
    installPrompt.prompt();

  }
  if (!installHelp.hidden){ installHelp.hidden = true; return; }
  const share = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3.5M8 7l4-4 4 4"/><path d="M6 11v8.5h12V11"/></svg>';

});
const homeSet = $('#homeSet'), homeClr = $('#homeClr');
/* naming a new view happens in the views sheet: the "+ Save" chip opens into a name box */
function openSaveForm(){

function commitSave(){

$('#saveBtn').addEventListener('click', e => { e.stopPropagation(); openSaveForm(); });

els.down.addEventListener('click', e => { e.stopPropagation(); down(); });

/* Refresh: reload the data and keep the view exactly as it is. Also runs when the app comes back to the
   front after a while, so an iPad left on the counter is not showing this morning's numbers. */
const refreshBtn = $('#refreshBtn'); let lastRefresh = Date.now(), noteTimer = 0;
async function refreshData(quiet){
  if (refreshBtn.classList.contains('busy')) return;
  refreshBtn.classList.add('busy'); const t0 = performance.now(); let ok = true;
  try { TICKETS = await loadTickets(); } catch (e) { ok = false; }
  await new Promise(r => setTimeout(r, Math.max(0, 500 - (performance.now() - t0))));   /* long enough to see it happened */
  refreshBtn.classList.remove('busy');
  if (ok){
    lastRefresh = Date.now(); stampDays();
    if (state.selTicket) state.selTicket = TICKETS.find(t => t.id === state.selTicket.id) || null;
  }
  lensNote = ok ? 'Updated ' + new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : 'Could not refresh. Showing the last data.';
  clearTimeout(noteTimer); noteTimer = setTimeout(() => { lensNote = ''; renderLens(); }, ok ? 2600 : 6000);
  if (!quiet) tick();
  render();
}
refreshBtn.addEventListener('click', e => { e.stopPropagation(); refreshData(false); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastRefresh > 5 * 60 * 1000) refreshData(true); });
/* Theme: Auto follows the device; Light and Dark pin it. */
const themeBtn = $('#themeBtn');
function applyTheme(){

if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

/* Turning the device (or crossing into the other layout) re-flows everything. Positions, sizes and the deck's

let wasSide = sideMQ.matches, wasTall = innerHeight > innerWidth;
